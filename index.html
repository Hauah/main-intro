
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be Patient..</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }

    </style>
</head>

<body>

    <video id="intro" autoplay muted playsinline>
        <source src="intro.mp4" type="video/webm">
    </video>

    <div id="blackScreen"></div>

    <script>
        const video = document.getElementById("intro");
    
        video.addEventListener("ended", function () {

            video.style.display = "none";
           

            setTimeout(function () {
                window.location.href = "https://www.ig.com";
            }, 1000);

        });
    </script>

</body>
</html>
