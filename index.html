<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ummm...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }
    </style>
</head>

<body>

    <video id="intro" autoplay muted playsinline loop>
        <source src="intro.mp4" type="video/mp4">
    </video>

    <script>
        const DIARY_URL = "https://her-sketchbook.vercel.app";

        function checkOrientation() {
            const isLandscape =
                window.matchMedia("(orientation: landscape)").matches;

            if (isLandscape) {
                window.location.replace(DIARY_URL);
            }
        }

        // Check immediately
        checkOrientation();

        // Check whenever orientation changes
        window.addEventListener("orientationchange", checkOrientation);
        window.addEventListener("resize", checkOrientation);

        if (screen.orientation) {
            screen.orientation.addEventListener(
                "change",
                checkOrientation
            );
        }
    </script>

</body>
</html>
